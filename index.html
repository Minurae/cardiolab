<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CardioLab 3.0 - Simulador Farmacológico</title>
  <style>
    :root {
      --c-void: #001219;
      --c-dark-teal: #005F73;
      --c-ocean-teal: #0A9396;
      --c-sage-mint: #94D2BD;
      --c-champagne: #E9D8A6;
      --c-amber-gold: #EE9B00;
      --c-burnt-orange: #CA6702;
      --c-flame-rust: #BB3E03;
      --c-crimson: #AE2012;
      --c-wine: #9B2226;
      
      --bg-page: #f4f7f6;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 95, 115, 0.2);
      --glass-border-strong: rgba(0, 95, 115, 0.38);
      --text-main: #001219;
      --text-muted: #005F73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      border-radius: 0 !important;
    }

    body {
      background: radial-gradient(circle at 10% 10%, #ffffff 0%, var(--bg-page) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Barra Superior */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1.5px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(0, 18, 25, 0.04);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--c-dark-teal), var(--c-ocean-teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand span {
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.85;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Toggle Modo Inmediato / En Vivo */
    .mode-switch-wrap {
      display: flex;
      align-items: center;
      background: rgba(0, 95, 115, 0.08);
      border: 1.5px solid var(--glass-border);
      padding: 3px;
    }

    .mode-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--c-ocean-teal);
      color: #fff;
    }

    .liquid-glass {
      background: var(--bg-surface);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 95, 115, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .btn-glass {
      background: rgba(10, 147, 150, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--c-ocean-teal);
      color: var(--c-dark-teal);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0, 18, 25, 0.04);
      min-height: 36px;
    }

    .btn-glass:hover {
      background: rgba(10, 147, 150, 0.22);
      border-color: var(--c-dark-teal);
      transform: translateY(-1px);
    }

    .btn-glass:active {
      transform: scale(0.98);
    }

    .btn-glass.btn-danger {
      background: rgba(174, 32, 18, 0.12);
      border-color: var(--c-crimson);
      color: var(--c-crimson);
    }
    .btn-glass.btn-danger:hover {
      background: rgba(174, 32, 18, 0.22);
    }

    /* Pestañas Móviles */
    .mobile-nav-tabs {
      display: none;
      padding: 6px 14px;
      gap: 8px;
      background: rgba(255, 255, 255, 0.95);
      position: sticky;
      top: 60px;
      z-index: 90;
      border-bottom: 1.5px solid var(--glass-border);
    }

    .mobile-tab-btn {
      flex: 1;
      padding: 9px 0;
      border: 1.5px solid transparent;
      background: rgba(0, 95, 115, 0.08);
      color: var(--c-dark-teal);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .mobile-tab-btn.active {
      background: var(--c-ocean-teal);
      color: #fff;
      border-color: var(--c-dark-teal);
    }

    /* Layout Responsive Principal */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 18px;
      padding: 18px 22px;
      max-width: 1680px;
      margin: 0 auto;
      width: 100%;
    }

    .viewport-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .telemetry-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px 18px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .metric-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .metric-value {
      font-size: 1.65rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .metric-unit {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .chart-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 440px;
    }

    .chart-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-legends {
      display: flex;
      gap: 14px;
      font-size: 0.76rem;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .legend-tag {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-bullet {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(0, 18, 25, 0.2);
    }

    .canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 360px;
      overflow: hidden;
      background: #ffffff;
      border: 1.5px solid var(--glass-border-strong);
      box-shadow: inset 0 2px 8px rgba(0, 18, 25, 0.04);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Columna Derecha */
    .controls-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-box {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--c-dark-teal);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid var(--glass-border);
      padding-bottom: 6px;
    }

    .drug-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .drug-card {
      padding: 9px 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 50px;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .drug-card:hover {
      background: rgba(148, 210, 189, 0.2);
      border-color: var(--c-ocean-teal);
    }

    .drug-card.active {
      background: var(--c-dark-teal);
      border: 1.5px solid var(--c-void);
      box-shadow: 0 4px 10px rgba(0, 95, 115, 0.22);
    }

    .drug-card.active .drug-name {
      color: #ffffff;
    }

    .drug-card.active .drug-mech {
      color: var(--c-champagne);
    }

    .drug-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .drug-mech {
      font-size: 0.66rem;
      color: var(--text-muted);
      opacity: 0.85;
      font-weight: 500;
    }

    /* Entrada de Dosis y Unidades */
    .dose-input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 95, 115, 0.04);
      padding: 12px;
      border: 1.5px solid var(--glass-border);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .dose-field {
      flex: 1;
      background: #ffffff;
      border: 1.5px solid var(--c-ocean-teal);
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 800;
      outline: none;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
    }

    .dose-field:focus {
      border-color: var(--c-dark-teal);
      box-shadow: 0 0 0 2px rgba(10, 147, 150, 0.2);
    }

    /* Selector desplegable de unidades */
    .unit-selector {
      background: var(--c-dark-teal);
      color: #ffffff;
      border: 1.5px solid var(--c-dark-teal);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0 12px;
      cursor: pointer;
      outline: none;
    }

    .stepper-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .btn-step {
      padding: 7px 0;
      background: #ffffff;
      border: 1.5px solid var(--glass-border);
      color: var(--c-dark-teal);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-step:hover {
      background: rgba(148, 210, 189, 0.3);
      border-color: var(--c-ocean-teal);
    }

    .btn-step:active {
      background: var(--c-ocean-teal);
      color: #fff;
    }

    .btn-inject-big {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--c-burnt-orange) 0%, var(--c-flame-rust) 100%);
      border: 1.5px solid var(--c-crimson);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      box-shadow: 0 5px 16px rgba(187, 62, 3, 0.25);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-inject-big:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 7px 20px rgba(187, 62, 3, 0.35);
    }

    .btn-inject-big:active {
      transform: scale(0.98);
    }

    /* Historial */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--c-ocean-teal);
    }

    .history-item {
      padding: 9px 12px;
      background: #ffffff;
      border: 1.5px solid var(--glass-border);
      border-left: 4px solid var(--c-ocean-teal);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.77rem;
    }

    .hist-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hist-title {
      font-weight: 800;
      color: var(--text-main);
    }

    .hist-meta {
      font-size: 0.67rem;
      color: var(--text-muted);
      opacity: 0.85;
      font-weight: 600;
    }

    .hist-stats {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 0.71rem;
      line-height: 1.35;
      color: var(--text-main);
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--c-ocean-teal);
      border: 1px solid var(--c-dark-teal);
    }

    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }
      .brand h1 {
        font-size: 1.1rem;
      }
      .brand span {
        display: none;
      }
      .btn-glass span:not(#playIcon) {
        display: none;
      }
      .header-actions {
        gap: 6px;
      }
      .btn-glass {
        padding: 6px 10px;
        min-height: 34px;
      }

      .mobile-nav-tabs {
        display: flex;
      }

      main {
        grid-template-columns: 1fr;
        padding: 12px;
        gap: 12px;
      }

      .viewport-col.mobile-hidden,
      .controls-col.mobile-hidden {
        display: none !important;
      }

      .telemetry-bar {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px;
      }

      .metric-value {
        font-size: 1.4rem;
      }

      .chart-panel {
        min-height: 360px;
        padding: 10px;
      }

      .canvas-container {
        min-height: 270px;
      }

      .drug-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>CARDIOLAB 3.0</h1>
      <span>Simulador Farmacológico Hemodinámico</span>
    </div>
    <div class="header-actions">
      <!-- Toggle de Modos: Inmediato (Default) vs En Vivo -->
      <div class="mode-switch-wrap">
        <button class="mode-btn active" id="btnModeImmediate" title="Calcula y muestra la curva completa al inyectar">⚡ Inmediato</button>
        <button class="mode-btn" id="btnModeLive" title="Trazado continuo en tiempo real">⏱ En Vivo</button>
      </div>

      <div style="display:flex; align-items:center; gap:6px;">
        <span class="status-badge" id="statusDot"></span>
        <span style="font-size:0.75rem; font-weight:700; color:var(--c-dark-teal)" id="timeDisplay">00:00.0</span>
      </div>

      <button class="btn-glass" id="btnTogglePlay" style="display:none;" aria-label="Pausar / Reanudar">
        <span id="playIcon">⏸</span> <span id="playText">Pausar</span>
      </button>
      <button class="btn-glass btn-danger" id="btnReset" aria-label="Reiniciar">
        <span>🔄</span> <span>Reiniciar</span>
      </button>
      <button class="btn-glass" id="btnExportCSV" aria-label="Exportar CSV">
        <span>📥</span> <span>CSV</span>
      </button>
    </div>
  </header>

  <!-- Pestañas móviles -->
  <nav class="mobile-nav-tabs" id="mobileTabs">
    <button class="mobile-tab-btn active" data-target="polygraph">📈 Gráfica & Métricas</button>
    <button class="mobile-tab-btn" data-target="controls">💉 Fármacos & Historial</button>
  </nav>

  <main>
    <!-- Viewport: Polígrafo y Telemetría -->
    <section class="viewport-col" id="viewSection">
      <div class="liquid-glass telemetry-bar">
        <div class="metric-item">
          <span class="metric-label">PA (SIS / DIA)</span>
          <div class="metric-value-wrap">
            <span class="metric-value" id="valSysDia" style="color:var(--c-burnt-orange)">120 / 80</span>
            <span class="metric-unit">mmHg</span>
          </div>
        </div>
        <div class="metric-item">
          <span class="metric-label">PAM</span>
          <div class="metric-value-wrap">
            <span class="metric-value" id="valPAM" style="color:var(--c-dark-teal)">93.3</span>
            <span class="metric-unit">mmHg</span>
          </div>
        </div>
        <div class="metric-item">
          <span class="metric-label">FC</span>
          <div class="metric-value-wrap">
            <span class="metric-value" id="valFC" style="color:var(--c-ocean-teal)">72</span>
            <span class="metric-unit">lpm</span>
          </div>
        </div>
        <div class="metric-item">
          <span class="metric-label">Barorreflejo</span>
          <div class="metric-value-wrap">
            <span class="metric-value" id="valBaro" style="color:var(--c-flame-rust)">Activo</span>
            <span class="metric-unit">SNA</span>
          </div>
        </div>
      </div>

      <div class="liquid-glass chart-panel">
        <div class="chart-panel-header">
          <div class="chart-legends">
            <div class="legend-tag">
              <span class="legend-bullet" style="background:var(--c-burnt-orange)"></span>
              <span style="color:var(--c-burnt-orange)">PA Sistólica</span>
            </div>
            <div class="legend-tag">
              <span class="legend-bullet" style="background:var(--c-flame-rust)"></span>
              <span style="color:var(--c-flame-rust)">PA Diastólica</span>
            </div>
            <div class="legend-tag">
              <span class="legend-bullet" style="background:var(--c-ocean-teal)"></span>
              <span style="color:var(--c-ocean-teal)">Frecuencia Cardíaca</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span id="scaleIndicator" style="font-size:0.72rem; font-weight:700; color:var(--c-dark-teal); background:rgba(0,95,115,0.08); padding:3px 8px; border:1px solid var(--glass-border);">Escala: 20-240</span>
          </div>
        </div>

        <div class="canvas-container">
          <canvas id="polygraphCanvas"></canvas>
        </div>
      </div>
    </section>

    <!-- Controles -->
    <aside class="controls-col" id="controlsSection">
      <div class="liquid-glass panel-box">
        <div class="panel-title">
          <span>Administración I.V.</span>
        </div>

        <div class="drug-grid" id="drugGrid"></div>

        <!-- Entrada de Dosis con Selector de Unidades -->
        <div class="dose-input-section">
          <label style="font-size:0.72rem; font-weight:800; color:var(--c-dark-teal); letter-spacing:0.5px">DOSIS Y UNIDAD</label>
          <div class="input-row">
            <input type="number" inputmode="decimal" step="any" min="0.01" class="dose-field" id="inputDose" value="10">
            <select class="unit-selector" id="unitSelect" title="Cambiar unidad de dosis">
              <option value="µg">µg</option>
              <option value="mg">mg</option>
              <option value="µg/kg">µg/kg</option>
              <option value="mg/kg">mg/kg</option>
            </select>
          </div>

          <div class="stepper-row">
            <button class="btn-step" data-val="1">1</button>
            <button class="btn-step" data-val="5">5</button>
            <button class="btn-step" data-val="10">10</button>
            <button class="btn-step" data-val="50">50</button>
          </div>
        </div>

        <button class="btn-inject-big" id="btnInject">
          <span>💉</span> Inyectar Dosis
        </button>
      </div>

      <!-- Historial -->
      <div class="liquid-glass panel-box" style="flex:1;">
        <div class="panel-title">
          <span>Historial de Respuestas</span>
          <span style="font-size:0.72rem; color:var(--text-muted); font-weight:700;" id="histCount">0 Eventos</span>
        </div>

        <div class="history-list" id="historyList">
          <div style="text-align:center; padding:24px 10px; color:var(--text-muted); font-size:0.78rem; font-weight:600;">
            No hay inyecciones registradas aún.
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    /* ==========================================================
       1. FÁRMACOS Y CONFIGURACIÓN INICIAL
       ========================================================== */
    const DRUGS = [
      { id: 'adr', name: 'Adrenalina', mech: 'Agonista α1, β1, β2', defaultUnit: 'µg', defaultDose: 10, color: '#CA6702' },
      { id: 'nor', name: 'Noradrenalina', mech: 'Agonista α1, β1', defaultUnit: 'µg', defaultDose: 10, color: '#EE9B00' },
      { id: 'iso', name: 'Isoprenalina', mech: 'Agonista β1, β2', defaultUnit: 'µg', defaultDose: 5, color: '#0A9396' },
      { id: 'ach', name: 'Acetilcolina', mech: 'Agonista Muscarínico M2', defaultUnit: 'µg', defaultDose: 10, color: '#AE2012' },
      { id: 'atr', name: 'Atropina', mech: 'Antagonista M2', defaultUnit: 'mg', defaultDose: 1, color: '#9B2226' },
      { id: 'phe', name: 'Fentolamina', mech: 'Antagonista α1', defaultUnit: 'mg', defaultDose: 2, color: '#005F73' },
      { id: 'pro', name: 'Propranolol', mech: 'Antagonista β1, β2', defaultUnit: 'mg', defaultDose: 2, color: '#0A9396' }
    ];

    let selectedDrug = DRUGS[0];
    let simulationMode = 'immediate'; // 'immediate' (default) o 'live'
    let isRunning = true;
    let simTime = 0;

    let systolic = 120.0;
    let diastolic = 80.0;
    let PAM = 93.3;
    let FC = 72.0;
    let baroTone = 0.0;

    let activeConcentrations = {};
    DRUGS.forEach(d => activeConcentrations[d.id] = 0);

    const historyPoints = [];
    const injectionEvents = [];
    const maxPointsOnCanvas = 450;

    let currentYMin = 20.0;
    let currentYMax = 240.0;
    const defaultYMin = 20.0;
    const defaultYMax = 240.0;

    // Crear línea de base inicial de 5 segundos
    for (let i = 0; i < 50; i++) {
      simTime += 0.1;
      historyPoints.push({ t: simTime, sys: 120, dia: 80, pam: 93.3, fc: 72 });
    }

    /* ==========================================================
       2. MOTOR FARMACODINÁMICO Y BARORREFLEJO
       ========================================================== */
    function updatePhysics(dt) {
      simTime += dt;

      for (let d of DRUGS) {
        let conc = activeConcentrations[d.id];
        if (conc > 0) {
          let kel = (d.defaultUnit === 'mg') ? 0.025 : 0.18;
          activeConcentrations[d.id] = Math.max(0, conc * Math.exp(-kel * dt));
        }
      }

      let phent = activeConcentrations['phe'];
      let prop  = activeConcentrations['pro'];
      let atrop = activeConcentrations['atr'];

      let a1_shift = 1.0 + (phent / 0.015);
      let b1_shift = 1.0 + (prop / 0.012);
      let b2_shift = 1.0 + (prop / 0.015);
      let m2_shift = 1.0 + (atrop / 0.008);

      let adr = activeConcentrations['adr'];
      let nor = activeConcentrations['nor'];
      let iso = activeConcentrations['iso'];
      let ach = activeConcentrations['ach'];

      let act_a1 = (adr * 1.0 + nor * 1.6) / a1_shift;
      let e_a1 = act_a1 / (0.012 + act_a1);

      let act_b1 = (adr * 1.2 + nor * 0.8 + iso * 2.5) / b1_shift;
      let e_b1 = act_b1 / (0.009 + act_b1);

      let act_b2 = (adr * 0.95 + iso * 2.2) / b2_shift;
      let e_b2 = act_b2 / (0.013 + act_b2);

      let act_m2 = ach / m2_shift;
      let e_m2 = act_m2 / (0.007 + act_m2);

      let targetRVP = 1.0 + (e_a1 * 1.4) - (e_b2 * 0.45) - (e_m2 * 0.25);
      let targetSV  = 70.0 * (1.0 + (e_b1 * 0.6) - (e_m2 * 0.35));

      let targetMAP = 93.3 * targetRVP * (targetSV / 70.0);
      let mapDelta = targetMAP - 93.3;

      let targetBaro = -mapDelta * 0.65;
      baroTone += (targetBaro - baroTone) * (dt / 1.8);

      let targetHR = 72.0 + (e_b1 * 75.0) - (e_m2 * 48.0) + baroTone;

      FC += (Math.max(10, Math.min(300, targetHR)) - FC) * 0.12;
      PAM += (Math.max(15, Math.min(320, targetMAP)) - PAM) * 0.12;

      let pulsePressure = 40.0 * (targetSV / 70.0);
      systolic = PAM + (pulsePressure * (2.0 / 3.0));
      diastolic = PAM - (pulsePressure * (1.0 / 3.0));

      historyPoints.push({
        t: simTime,
        sys: systolic,
        dia: diastolic,
        pam: PAM,
        fc: FC
      });
      if (historyPoints.length > 5000) historyPoints.shift();
    }

    /* ==========================================================
       3. CONVERSIÓN DE DOSIS Y EJECUCIÓN
       ========================================================== */
    function convertDoseToStandardMg(dose, unit) {
      // Asume peso estándar de laboratorio de 70 kg si la unidad es por kg
      const assumedWeightKg = 70.0;
      switch (unit) {
        case 'µg': return dose / 1000.0;
        case 'mg': return dose;
        case 'µg/kg': return (dose * assumedWeightKg) / 1000.0;
        case 'mg/kg': return dose * assumedWeightKg;
        default: return dose / 1000.0;
      }
    }

    function executeInjection() {
      const dose = parseFloat(inputDose.value);
      const unit = unitSelect.value;
      if (isNaN(dose) || dose <= 0) return;

      const doseMg = convertDoseToStandardMg(dose, unit);
      activeConcentrations[selectedDrug.id] += doseMg * 0.8;

      const evt = {
        id: Date.now(),
        timestamp: simTime,
        drug: selectedDrug.name,
        dose: dose,
        unit: unit,
        color: selectedDrug.color,
        baselinePAM: PAM.toFixed(1),
        baselineFC: Math.round(FC)
      };

      injectionEvents.push(evt);
      updateHistoryUI();

      // En Modo Inmediato: se simula un bloque temporal de golpe (25 segundos a dt=0.1s)
      if (simulationMode === 'immediate') {
        for (let i = 0; i < 250; i++) {
          updatePhysics(0.1);
        }
        updateTelemetryUI();
      }

      if (window.innerWidth <= 768) {
        switchMobileTab('polygraph');
      }
    }

    function updateTelemetryUI() {
      document.getElementById('valSysDia').textContent = `${Math.round(systolic)} / ${Math.round(diastolic)}`;
      document.getElementById('valPAM').textContent = PAM.toFixed(1);
      document.getElementById('valFC').textContent = Math.round(FC);

      const m = Math.floor(simTime / 60);
      const s = (simTime % 60).toFixed(1);
      document.getElementById('timeDisplay').textContent = `${m.toString().padStart(2, '0')}:${s.padStart(4, '0')}`;
    }

    /* ==========================================================
       4. CANVAS RESPONSIVO
       ========================================================== */
    const canvas = document.getElementById('polygraphCanvas');
    const ctx = canvas.getContext('2d');
    const scaleIndicator = document.getElementById('scaleIndicator');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    function drawPolygraph() {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const dpr = window.devicePixelRatio || 1;
      const displayPoints = historyPoints.slice(-maxPointsOnCanvas);

      let targetYMin = defaultYMin;
      let targetYMax = defaultYMax;

      if (displayPoints.length > 0) {
        let maxObserved = -Infinity;
        let minObserved = Infinity;

        for (let pt of displayPoints) {
          if (pt.sys > maxObserved) maxObserved = pt.sys;
          if (pt.fc > maxObserved) maxObserved = pt.fc;
          if (pt.dia < minObserved) minObserved = pt.dia;
          if (pt.fc < minObserved) minObserved = pt.fc;
        }

        if (maxObserved > defaultYMax - 15) {
          targetYMax = Math.ceil((maxObserved * 1.15) / 20) * 20;
        }
        if (minObserved < defaultYMin + 10) {
          targetYMin = Math.max(0, Math.floor((minObserved * 0.85) / 10) * 10);
        }
      }

      currentYMin += (targetYMin - currentYMin) * (simulationMode === 'immediate' ? 0.3 : 0.08);
      currentYMax += (targetYMax - currentYMax) * (simulationMode === 'immediate' ? 0.3 : 0.08);
      scaleIndicator.textContent = `Escala: ${Math.round(currentYMin)}-${Math.round(currentYMax)}`;

      const valToY = v => H - ((v - currentYMin) / (currentYMax - currentYMin)) * H;

      // Rejilla
      ctx.strokeStyle = 'rgba(0, 95, 115, 0.08)';
      ctx.lineWidth = 1;
      const gridStep = 40 * dpr;
      for (let x = 0; x < W; x += gridStep) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      const range = currentYMax - currentYMin;
      let tickInterval = range > 360 ? 80 : (range > 260 ? 60 : 40);
      const firstTick = Math.ceil(currentYMin / tickInterval) * tickInterval;

      for (let level = firstTick; level < currentYMax; level += tickInterval) {
        const y = valToY(level);
        ctx.strokeStyle = 'rgba(0, 95, 115, 0.16)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = '#005F73';
        ctx.font = `bold ${9 * dpr}px -apple-system, sans-serif`;
        ctx.fillText(`${level}`, 6 * dpr, y - 4);
      }

      if (displayPoints.length < 2) return;

      const stepX = W / (maxPointsOnCanvas - 1);
      const startOffset = maxPointsOnCanvas - displayPoints.length;

      function renderLine(prop, strokeStyle, lineWidth) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth * dpr;
        ctx.beginPath();
        for (let i = 0; i < displayPoints.length; i++) {
          const x = (startOffset + i) * stepX;
          const y = valToY(displayPoints[i][prop]);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      renderLine('sys', '#CA6702', 2.4);
      renderLine('dia', '#BB3E03', 2.0);
      renderLine('fc',  '#0A9396', 2.4);

      // Inyecciones
      injectionEvents.forEach(evt => {
        const lastT = historyPoints[historyPoints.length - 1]?.t || 0;
        const timeDiff = lastT - evt.timestamp;
        const ptsAgo = timeDiff / 0.1;
        if (ptsAgo >= 0 && ptsAgo <= maxPointsOnCanvas) {
          const x = W - (ptsAgo * stepX);
          ctx.strokeStyle = evt.color;
          ctx.lineWidth = 1.6 * dpr;
          ctx.setLineDash([5, 3]);
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = evt.color;
          ctx.font = `bold ${10 * dpr}px -apple-system, sans-serif`;
          ctx.fillText(`▲ ${evt.drug}`, x + 4, 18 * dpr);
        }
      });
    }

    /* ==========================================================
       5. INTERFAZ Y MANEJO DE EVENTOS
       ========================================================== */
    const drugGrid = document.getElementById('drugGrid');
    const inputDose = document.getElementById('inputDose');
    const unitSelect = document.getElementById('unitSelect');
    const historyList = document.getElementById('historyList');

    function renderDrugGrid() {
      drugGrid.innerHTML = '';
      DRUGS.forEach(d => {
        const card = document.createElement('div');
        card.className = `drug-card ${d.id === selectedDrug.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="drug-name">${d.name}</div>
          <div class="drug-mech">${d.mech}</div>
        `;
        card.onclick = () => {
          selectedDrug = d;
          inputDose.value = d.defaultDose;
          unitSelect.value = d.defaultUnit;
          renderDrugGrid();
        };
        drugGrid.appendChild(card);
      });
    }

    function updateHistoryUI() {
      document.getElementById('histCount').textContent = `${injectionEvents.length} Eventos`;
      if (injectionEvents.length === 0) return;

      historyList.innerHTML = '';
      [...injectionEvents].reverse().forEach(evt => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.style.borderLeftColor = evt.color;
        item.innerHTML = `
          <div class="hist-main">
            <span class="hist-title" style="color:${evt.color}">${evt.drug} (${evt.dose} ${evt.unit})</span>
            <span class="hist-meta">T = ${evt.timestamp.toFixed(1)}s</span>
          </div>
          <div class="hist-stats">
            <div>PAM: <b>${evt.baselinePAM}</b></div>
            <div style="color:var(--c-ocean-teal)">FC: <b>${evt.baselineFC}</b></div>
          </div>
        `;
        historyList.appendChild(item);
      });
    }

    // Toggle de Modo: Inmediato vs En Vivo
    const btnModeImmediate = document.getElementById('btnModeImmediate');
    const btnModeLive = document.getElementById('btnModeLive');
    const btnTogglePlay = document.getElementById('btnTogglePlay');

    btnModeImmediate.onclick = () => {
      simulationMode = 'immediate';
      btnModeImmediate.classList.add('active');
      btnModeLive.classList.remove('active');
      btnTogglePlay.style.display = 'none';
    };

    btnModeLive.onclick = () => {
      simulationMode = 'live';
      btnModeLive.classList.add('active');
      btnModeImmediate.classList.remove('active');
      btnTogglePlay.style.display = 'inline-flex';
    };

    const viewSection = document.getElementById('viewSection');
    const controlsSection = document.getElementById('controlsSection');
    const tabButtons = document.querySelectorAll('.mobile-tab-btn');

    function switchMobileTab(target) {
      tabButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.target === target);
      });
      if (target === 'polygraph') {
        viewSection.classList.remove('mobile-hidden');
        controlsSection.classList.add('mobile-hidden');
        setTimeout(resizeCanvas, 50);
      } else {
        viewSection.classList.add('mobile-hidden');
        controlsSection.classList.remove('mobile-hidden');
      }
    }

    tabButtons.forEach(btn => {
      btn.onclick = () => switchMobileTab(btn.dataset.target);
    });

    function handleResizeLayout() {
      if (window.innerWidth > 768) {
        viewSection.classList.remove('mobile-hidden');
        controlsSection.classList.remove('mobile-hidden');
      } else {
        const activeBtn = document.querySelector('.mobile-tab-btn.active');
        switchMobileTab(activeBtn ? activeBtn.dataset.target : 'polygraph');
      }
      resizeCanvas();
    }
    window.addEventListener('resize', handleResizeLayout);

    document.querySelectorAll('.btn-step').forEach(btn => {
      btn.onclick = () => { inputDose.value = btn.dataset.val; };
    });

    document.getElementById('btnInject').onclick = executeInjection;

    btnTogglePlay.onclick = () => {
      isRunning = !isRunning;
      document.getElementById('playIcon').textContent = isRunning ? '⏸' : '▶';
      document.getElementById('playText').textContent = isRunning ? 'Pausar' : 'Reanudar';
      document.getElementById('statusDot').style.background = isRunning ? 'var(--c-ocean-teal)' : 'var(--c-crimson)';
    };

    document.getElementById('btnReset').onclick = () => {
      simTime = 0;
      systolic = 120.0;
      diastolic = 80.0;
      PAM = 93.3;
      FC = 72.0;
      baroTone = 0.0;
      currentYMin = defaultYMin;
      currentYMax = defaultYMax;
      DRUGS.forEach(d => activeConcentrations[d.id] = 0);
      historyPoints.length = 0;
      injectionEvents.length = 0;

      for (let i = 0; i < 50; i++) {
        simTime += 0.1;
        historyPoints.push({ t: simTime, sys: 120, dia: 80, pam: 93.3, fc: 72 });
      }

      updateTelemetryUI();
      updateHistoryUI();
    };

    document.getElementById('btnExportCSV').onclick = () => {
      if (historyPoints.length === 0) return;
      let csv = "Tiempo_s,PA_Sistolica_mmHg,PA_Diastolica_mmHg,PAM_mmHg,FC_lpm\n";
      historyPoints.forEach(p => {
        csv += `${p.t.toFixed(1)},${p.sys.toFixed(1)},${p.dia.toFixed(1)},${p.pam.toFixed(1)},${p.fc.toFixed(1)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cardiolab_${Date.now()}.csv`;
      a.click();
    };

    /* ==========================================================
       6. BUCLE PRINCIPAL
       ========================================================== */
    let lastTime = performance.now();
    let simAccumulator = 0;

    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // En Modo En Vivo corre a tiempo real continuo
      if (simulationMode === 'live' && isRunning) {
        simAccumulator += dt;
        while (simAccumulator >= 0.1) {
          updatePhysics(0.1);
          simAccumulator -= 0.1;
        }
        updateTelemetryUI();
      }

      drawPolygraph();
      requestAnimationFrame(loop);
    }

    renderDrugGrid();
    unitSelect.value = selectedDrug.defaultUnit;
    handleResizeLayout();
    updateTelemetryUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
